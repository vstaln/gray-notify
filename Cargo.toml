[package]
name = "gray-notify"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MIT"
description = "Desktop/terminal notification when the agent settles (OSC 777/99, notify-send). Port of pi's notify extension."

[[bin]]
name = "gray-notify"
path = "src/main.rs"

[dependencies]
serde_json = "1"

[profile.release]
strip = true
